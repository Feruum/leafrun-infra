    command: [api]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
  generation-event-relay:
    image: leafrun-e06-generation:source
    environment:
      GENERATION_DATABASE_URL: postgres://generation:${E06_GENERATION_DB_PASSWORD:?}@postgres:5432/generation?sslmode=disable
      GENERATION_NATS_ADDRESS: nats://nats:4222
      GENERATION_NATS_USER: generation
      GENERATION_NATS_PASSWORD: ${E06_NATS_GENERATION_PASSWORD:?}
    command: [event-relay]
