name: leafrun-e06
x-access-build: &access-build
  context: ./.cache/context/infra
  dockerfile: Dockerfile.access
  additional_contexts:
    contracts: ./.cache/context/contracts
    platform: ./.cache/context/platform
    access: ./.cache/context/access
x-access-environment: &access-environment
  ACCESS_LISTEN: :8080
  ACCESS_DATABASE_URL: postgres://access:${E06_ACCESS_DB_PASSWORD:?run e06-init-env.ps1}@postgres:5432/access?sslmode=disable
  ACCESS_KRATOS_PUBLIC_URL: http://127.0.0.1:54433/
  ACCESS_KRATOS_INTERNAL_URL: http://kratos:4433/
  ACCESS_KRATOS_ADMIN_URL: http://kratos:4434/
  ACCESS_PUBLIC_URL: http://127.0.0.1:58197/
  ACCESS_HYDRA_ADMIN_URL: http://hydra:4445
  ACCESS_HYDRA_INTERNAL_URL: http://hydra:4444
  ACCESS_HYDRA_PUBLIC_URL: http://127.0.0.1:54444/
  ACCESS_OAUTH_ISSUER: http://127.0.0.1:54444/
  ACCESS_OAUTH_CLIENT_ID: leafrun-e06-demo
  ACCESS_OAUTH_CALLBACK_URL: http://localhost:58200/oauth/callback
  ACCESS_OAUTH_AUDIENCE: leafrun-api
  ACCESS_OAUTH_SCOPES: leafrun.generate leafrun.status leafrun.source.read leafrun.resource.read leafrun.download offline_access
  ACCESS_OAUTH_KEY_HEX: ${E06_ACCESS_OAUTH_KEY_HEX:?run e06-init-env.ps1}
  ACCESS_OAUTH_KEY_ID: ${E06_ACCESS_OAUTH_KEY_ID:?run e06-init-env.ps1}
  ACCESS_SESSION_COOKIE: ory_kratos_session
  LEAFRUN_GUEST_COOKIE_NAME: leafrun_guest_session
  ACCESS_GUEST_OWNER_URLS: http://127.0.0.1:58290 http://127.0.0.1:58296 http://127.0.0.1:58291
  ACCESS_LOOPBACK_DEV: 'true'
  ACCESS_METADATA_RETENTION: 720h
  ACCESS_SERVICE_CREDENTIALS: '{"projects":"${E06_PROJECTS_SERVICE_TOKEN:?}","generation":"${E06_GENERATION_SERVICE_TOKEN:?}","storage":"${E06_STORAGE_SERVICE_TOKEN:?}","audit":"${E06_AUDIT_SERVICE_TOKEN:?}"}'
  ACCESS_IMPORT_OPERATOR_TOKEN: ${E06_IMPORT_OPERATOR_TOKEN:?}
  ACCESS_IMPORT_PROJECTS_URL: http://projects-api:8084
  ACCESS_IMPORT_PROJECTS_TOKEN: ${E06_IMPORT_PROJECTS_TOKEN:?}
  ACCESS_KETO_READ_URL: http://keto:4466
  ACCESS_KETO_WRITE_URL: http://keto:4467
  ACCESS_SERVICE_ACTIONS: '{"projects":["health","pin.acquire","pin.get","pin.release","snapshot.get"],"generation":["health","upload.create","upload.get","snapshot.create","snapshot.get","artifact.finalize","pin.acquire","pin.get","pin.release"],"audit":["health"]}'
  ACCESS_SERVICE_ACTOR_ACTIONS: '{"generation":{"leafrun-generation":["generation.cleanup"]}}'
x-audit-build: &audit-build
  context: ./.cache/context/infra
  dockerfile: Dockerfile.audit
  additional_contexts:
    contracts: ./.cache/context/contracts
    platform: ./.cache/context/platform
    audit: ./.cache/context/audit
x-audit-database: &audit-database
  LEAFRUN_AUDIT_DATABASE_URL: postgres://audit:${E06_AUDIT_DB_PASSWORD:?run e06-init-env.ps1}@postgres:5432/audit?sslmode=disable
  LEAFRUN_AUDIT_RETENTION: 720h
x-kratos-environment: &kratos-environment
  DSN: postgres://kratos:${E06_KRATOS_DB_PASSWORD:?}@postgres:5432/kratos?sslmode=disable
  SECRETS_COOKIE: ${E06_KRATOS_COOKIE_SECRET:?}
  SECRETS_CIPHER: ${E06_KRATOS_CIPHER_SECRET:?}
x-kratos-volumes: &kratos-volumes
  - ./ory/kratos.yaml:/etc/config/kratos/kratos.yaml:ro
  - ./ory/identity.schema.json:/etc/config/kratos/identity.schema.json:ro
services:
  nats:
    image: nats:2.15.1-alpine@sha256:2ae57dfba3063d5e25fecb75256118c0882a1a2d2cf7d0fba17a7c701df956f6
    command: ["--config", "/stand/nats.json"]
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    ports: ["127.0.0.1:54322:4222"]
    volumes: [e06-jetstream-data:/data, "./.cache/e06/nats.json:/stand/nats.json:ro"]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O - http://127.0.0.1:8222/healthz >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
  audit-stream-bootstrap:
    image: leafrun-e06-jetstream-bootstrap:source
    build:
      context: ./.cache/context/infra
      dockerfile: Dockerfile.e06-bootstrap
      additional_contexts:
        contracts: ./.cache/context/contracts
        platform: ./.cache/context/platform
        core: ./.cache/context/core
        integrations: ./.cache/context/integrations
    environment:
      LEAFRUN_E06_BOOTSTRAP: 'true'
      LEAFRUN_NATS_ADDRESS: nats://nats:4222
      LEAFRUN_NATS_USER: bootstrap
      LEAFRUN_NATS_PASSWORD: ${E06_NATS_ADMIN_PASSWORD:?}
      LEAFRUN_AUDIT_RETENTION: 720h
    depends_on: {nats: {condition: service_healthy}}
    read_only: true
  audit-migrate:
    image: leafrun-e06-audit:source
    build: *audit-build
    environment:
      <<: *audit-database
      LEAFRUN_AUDIT_ROLE: migrate
    depends_on: {postgres: {condition: service_healthy}}
    read_only: true
  audit-api:
    image: leafrun-e06-audit:source
    build: *audit-build
    environment:
      <<: *audit-database
      LEAFRUN_AUDIT_ROLE: api
      LEAFRUN_AUDIT_LISTEN: :8199
      LEAFRUN_AUDIT_ACCESS_URL: http://access-api-a:8080
      LEAFRUN_AUDIT_ACCESS_TOKEN: ${E06_AUDIT_SERVICE_TOKEN:?}
      LEAFRUN_AUDIT_SESSION_COOKIE: ory_kratos_session
      LEAFRUN_GUEST_COOKIE_NAME: leafrun_guest_session
      LEAFRUN_AUDIT_CURSOR_KEY_HEX: ${E06_AUDIT_CURSOR_KEY_HEX:?}
      LEAFRUN_AUDIT_OPERATORS_JSON: '{"e06-audit-operator":{"token":"${E06_AUDIT_OPERATOR_TOKEN:?}","authorityId":"${E06_AUDIT_OPERATOR_AUTHORITY_ID:?}","version":1,"actions":["audit.replay","audit.resolve"]}}'
    ports: ["127.0.0.1:58199:8199"]
    read_only: true
    depends_on: {audit-migrate: {condition: service_completed_successfully},access-api-a: {condition: service_started}}
    restart: unless-stopped
  audit-consumer:
    image: leafrun-e06-audit:source
    environment:
      <<: *audit-database
      LEAFRUN_AUDIT_ROLE: consumer
      LEAFRUN_AUDIT_NATS_URL: nats://nats:4222
      LEAFRUN_AUDIT_NATS_USER: audit
      LEAFRUN_AUDIT_NATS_PASSWORD: ${E06_NATS_AUDIT_PASSWORD:?}
    read_only: true
    depends_on: {audit-migrate: {condition: service_completed_successfully},audit-stream-bootstrap: {condition: service_completed_successfully}}
    restart: unless-stopped
  audit-cleanup:
    image: leafrun-e06-audit:source
    environment:
      <<: *audit-database
      LEAFRUN_AUDIT_ROLE: cleanup
      LEAFRUN_AUDIT_CLEANUP_INTERVAL: 5m
    read_only: true
    depends_on: {audit-migrate: {condition: service_completed_successfully}}
    restart: unless-stopped
  access-event-relay:
    image: leafrun-e06-access:source
    environment:
      <<: *access-environment
      ACCESS_NATS_ADDRESS: nats://nats:4222
      ACCESS_NATS_USER: access
      ACCESS_NATS_PASSWORD: ${E06_NATS_ACCESS_PASSWORD:?}
    command: [event-relay]
    read_only: true
    depends_on: {access-migrate: {condition: service_completed_successfully},audit-stream-bootstrap: {condition: service_completed_successfully}}
    restart: unless-stopped
  hydra-migrate:
    image: oryd/hydra:v26.2.0@sha256:ff67c7fb5f95074fa53374d41151713554960504b340cd3f95b09e65deaea2a9
    user: "10000:10000"
    environment: &hydra-environment
      DSN: postgres://hydra:${E06_HYDRA_DB_PASSWORD:?}@postgres:5432/hydra?sslmode=disable
      SECRETS_SYSTEM: ${E06_HYDRA_SYSTEM_SECRET:?}
      SECRETS_COOKIE: ${E06_HYDRA_COOKIE_SECRET:?}
    volumes: &hydra-volumes
      - ./ory/hydra.yaml:/etc/hydra/hydra.yaml:ro
    command: [migrate, sql, up, -e, --yes, --config, /etc/hydra/hydra.yaml]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      postgres: {condition: service_healthy}
  hydra:
    image: oryd/hydra:v26.2.0@sha256:ff67c7fb5f95074fa53374d41151713554960504b340cd3f95b09e65deaea2a9
    user: "10000:10000"
    environment: *hydra-environment
    volumes: *hydra-volumes
    command: [serve, all, --dev, --config, /etc/hydra/hydra.yaml]
    ports: ["127.0.0.1:54444:4444"]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      hydra-migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O - http://127.0.0.1:4445/health/ready >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
  oauth-demo:
    image: leafrun-e06-oauth-demo:source
    build:
      context: ./.cache/context/infra
      dockerfile: Dockerfile.oauth-demo
    environment:
      E06_DEMO_LISTEN: :58200
      E06_DEMO_TOKEN_URL: http://hydra:4444
    ports: ["127.0.0.1:58200:58200"]
    read_only: true
    depends_on:
      hydra: {condition: service_healthy}
    restart: unless-stopped
  # Isolated short-expiry token issuer for exact-expiry acceptance only. It
  # shares Hydra-owned state/secrets, has no host port and never changes live TTL.
  hydra-expiry:
    profiles: [checks]
    image: oryd/hydra:v26.2.0@sha256:ff67c7fb5f95074fa53374d41151713554960504b340cd3f95b09e65deaea2a9
    user: "10000:10000"
    environment:
      <<: *hydra-environment
      TTL_ACCESS_TOKEN: 5s
    volumes: *hydra-volumes
    command: [serve, all, --dev, --config, /etc/hydra/hydra.yaml]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      hydra-migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O - http://127.0.0.1:4445/health/ready >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
  keto-migrate:
    image: oryd/keto:v26.2.0@sha256:bfdb8b9e283aedbd9e1d005c44eb1bbefd2096b2cb5b5aa0b7360b6e39c178d2
    user: "10000:10000"
    environment: &keto-environment
      DSN: postgres://keto:${E06_KETO_DB_PASSWORD:?}@postgres:5432/keto?sslmode=disable
    volumes: &keto-volumes
      - ./ory/keto.yaml:/etc/keto/keto.yaml:ro
      - ./ory/namespaces.ts:/etc/keto/namespaces.ts:ro
    command: [migrate, up, --yes, --config, /etc/keto/keto.yaml]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      postgres: {condition: service_healthy}
  keto:
    image: oryd/keto:v26.2.0@sha256:bfdb8b9e283aedbd9e1d005c44eb1bbefd2096b2cb5b5aa0b7360b6e39c178d2
    user: "10000:10000"
    environment: *keto-environment
    volumes: *keto-volumes
    command: [serve, --config, /etc/keto/keto.yaml]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      keto-migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O - http://127.0.0.1:4466/health/ready >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_PASSWORD: ${E06_POSTGRES_ADMIN_PASSWORD:?run e06-init-env.ps1}
    ports: ["127.0.0.1:58534:5432"]
    volumes: [e06-postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
  kratos-migrate:
    image: oryd/kratos:v26.2.0@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
    user: "10000:10000"
    environment: *kratos-environment
    volumes: *kratos-volumes
    command: [migrate, sql, -e, --yes, --config, /etc/config/kratos/kratos.yaml]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      postgres: {condition: service_healthy}
  kratos:
    image: oryd/kratos:v26.2.0@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
    user: "10000:10000"
    environment: *kratos-environment
    volumes: *kratos-volumes
    command: [serve, --dev, --sqa-opt-out, --config, /etc/config/kratos/kratos.yaml]
    ports: ["127.0.0.1:54433:4433"]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      kratos-migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O - http://127.0.0.1:4434/health/ready >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
  access-migrate:
    image: leafrun-e06-access:source
    build: *access-build
    environment: *access-environment
    command: [migrate]
    read_only: true
    depends_on:
      postgres: {condition: service_healthy}
  access-api-a:
    image: leafrun-e06-access:source
    build: *access-build
    environment: *access-environment
    command: [api]
    ports: ["127.0.0.1:58197:8080"]
    read_only: true
    depends_on:
      access-migrate: {condition: service_completed_successfully}
      kratos: {condition: service_healthy}
      keto: {condition: service_healthy}
      hydra: {condition: service_healthy}
    restart: unless-stopped
  access-api-b:
    image: leafrun-e06-access:source
    environment: *access-environment
    command: [api]
    ports: ["127.0.0.1:58198:8080"]
    read_only: true
    depends_on:
      access-migrate: {condition: service_completed_successfully}
      kratos: {condition: service_healthy}
      keto: {condition: service_healthy}
      hydra: {condition: service_healthy}
    restart: unless-stopped
  access-reconcile:
    image: leafrun-e06-access:source
    environment: *access-environment
    command: [reconcile]
    read_only: true
    depends_on:
      access-migrate: {condition: service_completed_successfully}
      keto: {condition: service_healthy}
    restart: unless-stopped
  access-checks:
    profiles: [checks]
    image: leafrun-e06-access-checks:source
    build:
      <<: *access-build
      target: checks
    environment:
      ACCESS_TEST_DATABASE_URL: postgres://access:${E06_ACCESS_DB_PASSWORD:?}@postgres:5432/access_test?sslmode=disable
      E06_INTEGRATION: 'true'
      E06_KRATOS_INTERNAL_URL: http://kratos:4433
      E06_KRATOS_ADMIN_URL: http://kratos:4434
      E06_ACCESS_A_INTERNAL_URL: http://access-api-a:8080
      E06_ACCESS_B_INTERNAL_URL: http://access-api-b:8080
      E06_PROJECTS_SERVICE_TOKEN: ${E06_PROJECTS_SERVICE_TOKEN:?}
      E06_GENERATION_SERVICE_TOKEN: ${E06_GENERATION_SERVICE_TOKEN:?}
      E06_ACCESS_DATABASE_URL: postgres://access:${E06_ACCESS_DB_PASSWORD:?}@postgres:5432/access?sslmode=disable
      E06_KRATOS_EXPIRY_URL: http://kratos-expiry:4433
      E06_KETO_READ_URL: http://keto:4466
      E06_KETO_WRITE_URL: http://keto:4467
      E06_HYDRA_ADMIN_URL: http://hydra:4445
      E06_HYDRA_INTERNAL_URL: http://hydra:4444
      E06_ACCESS_OAUTH_KEY_HEX: ${E06_ACCESS_OAUTH_KEY_HEX:?}
      E06_ACCESS_OAUTH_KEY_ID: ${E06_ACCESS_OAUTH_KEY_ID:?}
  # Test-only issuer writes genuinely short sessions into the provider-owned
  # database; the normal provider and both Access nodes validate their expiry.
  kratos-expiry:
    profiles: [checks]
    image: oryd/kratos:v26.2.0@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
    user: "10000:10000"
    environment:
      <<: *kratos-environment
      SERVE_PUBLIC_BASE_URL: http://kratos-expiry:4433/
      SERVE_ADMIN_BASE_URL: http://kratos-expiry:4434/
      SESSION_LIFESPAN: 5s
    volumes: *kratos-volumes
    command: [serve, --dev, --sqa-opt-out, --config, /etc/config/kratos/kratos.yaml]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      kratos-migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O - http://127.0.0.1:4434/health/ready >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
  seaweed:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: [mini, '-dir=/data', '-ip=seaweed', '-ip.bind=0.0.0.0', '-master.telemetry=false', '-admin.ui=false', '-webdav=false', '-s3.port.iceberg=0', '-s3.port.lance=0', '-s3.allowDeleteBucketNotEmpty=false', '-s3.config=/stand/s3.json']
    environment: {S3_BUCKET: 'leafrun-e06-storage,leafrun-e06-storage-test'}
    ports: ['127.0.0.1:58643:8333']
    volumes: [e06-seaweed-data:/data, './.cache/e06/s3.json:/stand/s3.json:ro']
    restart: unless-stopped
  temporal-schema:
    image: temporalio/admin-tools:1.32.1@sha256:9ef0dc5b063bf4ffd5c1512de72e0e73e225bd2c7006a18ce69bd592a8862a83
    environment:
      SQL_HOST: postgres
      SQL_PORT: 5432
      SQL_USER: temporal
      SQL_PASSWORD: ${E06_TEMPORAL_DB_PASSWORD:?}
      SQL_PLUGIN: postgres12
      E06_TEMPORAL_SCHEMA_EXISTS: ${E06_TEMPORAL_SCHEMA_EXISTS:-unknown}
      E06_VISIBILITY_SCHEMA_EXISTS: ${E06_VISIBILITY_SCHEMA_EXISTS:-unknown}
    entrypoint: [sh, /stand/setup-temporal.sh]
    volumes: ['./temporal/e06-setup.sh:/stand/setup-temporal.sh:ro']
    depends_on: {postgres: {condition: service_healthy}}
  temporal:
    image: temporalio/server:1.32.1@sha256:acecbab5b0b8ae9cf4012b508866ca97feda3709577bf157b537239f40029049
    environment: {SQL_PASSWORD: '${E06_TEMPORAL_DB_PASSWORD:?}', TEMPORAL_ALLOW_NO_AUTH: 'true'}
    entrypoint: [sh, /stand/start.sh]
    ports: ['127.0.0.1:58743:7233']
    volumes: ['./temporal/start.sh:/stand/start.sh:ro', './temporal/config.template.yaml:/stand/config.template.yaml:ro']
    depends_on: {temporal-schema: {condition: service_completed_successfully}}
    restart: unless-stopped
  temporal-namespace:
    image: temporalio/admin-tools:1.32.1@sha256:9ef0dc5b063bf4ffd5c1512de72e0e73e225bd2c7006a18ce69bd592a8862a83
    entrypoint: [sh, /stand/namespace.sh]
    volumes: ['./temporal/namespace.sh:/stand/namespace.sh:ro']
    depends_on: [temporal]
  renderer-image:
    profiles: [build]
    image: leafrun-e06-renderer:source
    build: &generation-build
      context: ./.cache/context/infra
      dockerfile: Dockerfile.generation
      target: renderer
      additional_contexts:
        contracts: ./.cache/context/contracts
        core: ./.cache/context/core
        platform: ./.cache/context/platform
        integrations: ./.cache/context/integrations
        generation: ./.cache/context/generation
  owner-router:
    image: leafrun-e06-owner-router:source
    build:
      context: ./.cache/context/infra
      dockerfile: Dockerfile
      target: owner-router
      additional_contexts:
        contracts: ./.cache/context/contracts
        core: ./.cache/context/core
        platform: ./.cache/context/platform
        integrations: ./.cache/context/integrations
    environment:
      LEAFRUN_OWNER_AUTH_MODE: access
      LEAFRUN_OWNER_TOKEN: ${E06_OWNER_ROUTER_TOKEN:?}
      LEAFRUN_GENERATION_URL: http://generation-api:8080
      LEAFRUN_GENERATION_OWNER_TOKEN: ${E06_GENERATION_OWNER_TOKEN:?}
      LEAFRUN_PROJECTS_URL: http://projects-api:8084
      LEAFRUN_PROJECTS_OWNER_TOKEN: ${E06_PROJECTS_OWNER_TOKEN:?}
    read_only: true
    restart: unless-stopped
  storage-migrate:
    image: leafrun-e06-storage:source
    build: &storage-build
      context: ./.cache/context/infra
      dockerfile: Dockerfile.storage
      additional_contexts:
        storage: ./.cache/context/storage
        contracts: ./.cache/context/contracts
        platform: ./.cache/context/platform
    environment: &storage-environment
      LEAFRUN_STORAGE_AUTH_MODE: access
      LEAFRUN_STORAGE_SESSION_COOKIE: ory_kratos_session
      LEAFRUN_GUEST_COOKIE_NAME: leafrun_guest_session
      LEAFRUN_STORAGE_BROWSER_ORIGINS_JSON: '["http://127.0.0.1:58197","http://127.0.0.1:58291"]'
      LEAFRUN_STORAGE_LOOPBACK_HTTP: 'true'
      LEAFRUN_STORAGE_LISTEN: :8081
      LEAFRUN_STORAGE_DATABASE_URL: postgres://storage:${E06_STORAGE_DB_PASSWORD:?}@postgres:5432/storage?sslmode=disable
      LEAFRUN_STORAGE_S3_BUCKET: leafrun-e06-storage
      LEAFRUN_STORAGE_S3_ENDPOINT: http://seaweed:8333
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${E06_S3_ACCESS_KEY:?}
      AWS_SECRET_ACCESS_KEY: ${E06_S3_SECRET_KEY:?}
      LEAFRUN_STORAGE_OWNER_URL: http://owner-router:8082
      LEAFRUN_STORAGE_OWNER_TOKEN: ${E06_OWNER_ROUTER_TOKEN:?}
      LEAFRUN_STORAGE_ACCESS_URL: http://access-api-a:8080
      LEAFRUN_STORAGE_ACCESS_TOKEN: ${E06_STORAGE_SERVICE_TOKEN:?}
      LEAFRUN_STORAGE_IMPORT_VERIFIER_TOKEN: ${E06_IMPORT_STORAGE_TOKEN:?}
      LEAFRUN_STORAGE_SERVICE_CREDENTIALS: '[{"token":"${E06_GENERATION_STORAGE_TOKEN:?}","subject":"leafrun-generation","domain":"service","actions":["upload.create","upload.get","upload.put","upload.renew","resource.commit","snapshot.create","snapshot.get","resource.read","artifact.finalize","pin.acquire","pin.get","pin.activate","pin.release"]},{"token":"${E06_PROJECTS_STORAGE_TOKEN:?}","subject":"leafrun-projects","domain":"service","actions":["snapshot.get","resource.read","pin.acquire","pin.get","pin.activate","pin.release"]}]'
      LEAFRUN_STORAGE_TEMPORAL_ADDRESS: temporal:7233
    command: [migrate]
    depends_on: {postgres: {condition: service_healthy}}
  storage-api:
    image: leafrun-e06-storage:source
    build: *storage-build
    environment: *storage-environment
    command: [api]
    ports: ['127.0.0.1:58291:8081']
    read_only: true
    tmpfs: [/tmp]
    depends_on: {storage-migrate: {condition: service_completed_successfully}, seaweed: {condition: service_started}, owner-router: {condition: service_started}}
    restart: unless-stopped
  storage-worker:
    image: leafrun-e06-storage:source
    environment: *storage-environment
    command: [worker]
    read_only: true
    tmpfs: [/tmp]
    depends_on: {storage-migrate: {condition: service_completed_successfully}, temporal-namespace: {condition: service_completed_successfully}}
    restart: unless-stopped
  storage-api-replica:
    profiles: [replicas]
    image: leafrun-e06-storage:source
    environment: {<<: *storage-environment, LEAFRUN_STORAGE_ACCESS_URL: 'http://access-api-b:8080'}
    command: [api]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
  storage-event-relay:
    image: leafrun-e06-storage:source
    environment:
      LEAFRUN_STORAGE_DATABASE_URL: postgres://storage:${E06_STORAGE_DB_PASSWORD:?}@postgres:5432/storage?sslmode=disable
      LEAFRUN_STORAGE_NATS_ADDRESS: nats://nats:4222
      LEAFRUN_STORAGE_NATS_USER: storage
      LEAFRUN_STORAGE_NATS_PASSWORD: ${E06_NATS_STORAGE_PASSWORD:?}
    command: [event-relay]
    read_only: true
    depends_on: {storage-migrate: {condition: service_completed_successfully},audit-stream-bootstrap: {condition: service_completed_successfully}}
