      GENERATION_STORAGE_TOKEN: ${E06_GENERATION_STORAGE_TOKEN:?}
      GENERATION_OWNER_URL: http://access-api-a:8080
      GENERATION_OWNER_TOKEN: ${E06_GENERATION_SERVICE_TOKEN:?}
      GENERATION_OWNER_CALLBACK_TOKEN: ${E06_GENERATION_OWNER_TOKEN:?}
      GENERATION_PROJECTS_URL: http://projects-api:8084
