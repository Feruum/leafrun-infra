        contracts: ./.cache/context/contracts
        core: ./.cache/context/core
        platform: ./.cache/context/platform
        integrations: ./.cache/context/integrations
    environment: &projects-environment
      PROJECTS_AUTH_MODE: access
      PROJECTS_SESSION_COOKIE: ory_kratos_session
      LEAFRUN_GUEST_COOKIE_NAME: leafrun_guest_session
      PROJECTS_BROWSER_ORIGINS_JSON: '["http://127.0.0.1:58197","http://127.0.0.1:58296"]'
      PROJECTS_LOOPBACK_HTTP: 'true'
      PROJECTS_ROLE: migrate
      PROJECTS_HTTP_ADDR: :8084
      PROJECTS_DATABASE_URL: postgres://projects:${E06_PROJECTS_DB_PASSWORD:?}@postgres:5432/projects?sslmode=disable
      PROJECTS_STORAGE_URL: http://storage-api:8081
      PROJECTS_STORAGE_TOKEN: ${E06_PROJECTS_STORAGE_TOKEN:?}
      PROJECTS_OWNER_URL: http://access-api-a:8080
      PROJECTS_OWNER_TOKEN: ${E06_PROJECTS_SERVICE_TOKEN:?}
      PROJECTS_OWNER_CALLBACK_TOKEN: ${E06_PROJECTS_OWNER_TOKEN:?}
      PROJECTS_GENERATION_TOKEN: ${E06_PROJECTS_GENERATION_TOKEN:?}
      PROJECTS_IMPORT_VERIFIER_TOKEN: ${E06_IMPORT_PROJECTS_TOKEN:?}
      PROJECTS_IMPORT_STORAGE_TOKEN: ${E06_IMPORT_STORAGE_TOKEN:?}
    depends_on: {postgres: {condition: service_healthy}}
  projects-api:
    image: leafrun-e06-projects:source
    build: *projects-build
    environment: {<<: *projects-environment, PROJECTS_ROLE: api}
    ports: ['127.0.0.1:58296:8084']
    read_only: true
    tmpfs: [/tmp]
    depends_on: {projects-migrate: {condition: service_completed_successfully}}
    restart: unless-stopped
  projects-reconciler:
    image: leafrun-e06-projects:source
    environment: {<<: *projects-environment, PROJECTS_ROLE: reconcile, PROJECTS_HTTP_ADDR: ':8085'}
    read_only: true
    tmpfs: [/tmp]
    depends_on: {projects-migrate: {condition: service_completed_successfully}}
    restart: unless-stopped
  projects-api-replica:
    profiles: [replicas]
    image: leafrun-e06-projects:source
    environment: {<<: *projects-environment, PROJECTS_ROLE: api, PROJECTS_OWNER_URL: 'http://access-api-b:8080'}
    read_only: true
    tmpfs: [/tmp]
