    environment: &generation-environment
      GENERATION_AUTH_MODE: access
      GENERATION_AUDIT_CLEANUP_AUTHORITY_ID: generation-cleanup-service
      GENERATION_AUDIT_CLEANUP_AUTHORITY_VERSION: '1'
      GENERATION_SESSION_COOKIE: ory_kratos_session
      LEAFRUN_GUEST_COOKIE_NAME: leafrun_guest_session
      GENERATION_BROWSER_ORIGINS_JSON: '["http://127.0.0.1:58197","http://127.0.0.1:58290"]'
      GENERATION_LOOPBACK_HTTP: 'true'
      GENERATION_DATABASE_URL: postgres://generation:${E06_GENERATION_DB_PASSWORD:?}@postgres:5432/generation?sslmode=disable
