version: v26.2.0
serve:
  public:
    base_url: http://127.0.0.1:54433/
    cors:
      enabled: true
      allowed_origins:
        - http://127.0.0.1:58197
        - http://127.0.0.1:58198
      allowed_methods: [GET, POST, DELETE, OPTIONS]
      allowed_headers: [Accept, Authorization, Content-Type, Cookie]
      exposed_headers: [Content-Type, Set-Cookie]
      allow_credentials: true
  admin:
    base_url: http://kratos:4434/
selfservice:
  default_browser_return_url: http://127.0.0.1:58197/
  allowed_return_urls:
    - http://127.0.0.1:58197/
    - http://127.0.0.1:58198/
    - http://127.0.0.1:58197/oauth/resume
  methods:
    password:
      enabled: true
      config:
        min_password_length: 12
        haveibeenpwned_enabled: false
    code: {enabled: false}
    link: {enabled: false}
    oidc: {enabled: false}
    totp: {enabled: false}
    lookup_secret: {enabled: false}
    webauthn: {enabled: false}
    passkey: {enabled: false}
  flows:
    error:
      ui_url: http://127.0.0.1:58197/login/error
    login:
      ui_url: http://127.0.0.1:58197/login
      lifespan: 10m
    registration:
      enabled: false
    recovery:
      enabled: false
    verification:
      enabled: false
    settings:
      ui_url: http://127.0.0.1:58197/
identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json
cookies:
  path: /
  same_site: Lax
session:
  lifespan: 1h
  whoami:
    required_aal: aal1
  cookie:
    name: ory_kratos_session
    path: /
    same_site: Lax
log:
  level: error
  format: json
  leak_sensitive_values: false
